<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Planner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-white p-6 rounded-lg shadow-lg text-center">
        <h1 class="text-2xl font-bold text-blue-600 mb-4">📚 AI Study Planner</h1>
        <p class="text-gray-600 mb-6">Apna topic likhein aur AI se apna personal study plan banayein!</p>
        
        <input type="text" id="topicInput" placeholder="E.g., React Hooks, Photosynthesis" 
               class="w-full p-3 border border-gray-300 rounded-md mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
        
        <button id="generateBtn" class="w-full bg-blue-600 text-white p-3 rounded-md font-semibold hover:bg-blue-700 transition">
            Generate Plan ✨
        </button>

        <div id="result" class="mt-6 text-left hidden">
            <h3 class="font-bold text-lg text-gray-800 mb-2">Aapka Study Plan:</h3>
            <div id="planContent" class="text-gray-700 whitespace-pre-line bg-gray-50 p-4 rounded border border-gray-200"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
